name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Repository'yi Klonla
        uses: actions/checkout@v4

      - name: JDK 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Python 3.10 Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Önceki Önbellek Kalıntılarını Temizle
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer

      - name: Sistem Bağımlılıklarını Yükle
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            ffmpeg \
            libunwind-dev \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libgstreamer1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            libsqlite3-dev \
            sqlite3 \
            bzip2 \
            libbz2-dev \
            libssl-dev \
            openssl \
            libffi-dev \
            libgdbm-dev \
            libncursesw5-dev \
            libreadline-dev \
            tk-dev \
            libgdbm-compat-dev \
            lzma \
            liblzma-dev \
            uuid-dev \
            zip \
            unzip

      - name: Buildozer ve Cython Yükle
        run: |
          python -m pip install --upgrade pip setuptools
          pip install buildozer "cython<3.0.0"

      - name: APK Derle (Buildozer)
        run: |
          unset ANDROID_NDK_HOME
          unset ANDROID_NDK_ROOT
          unset ANDROID_NDK
          unset PIP_NO_BINARY
          buildozer -v android debug

      - name: APK Çıktısını Artifact Olarak Yükle
        uses: actions/upload-artifact@v4
        with:
          name: stok-takip-apk
          path: bin/*.apk
