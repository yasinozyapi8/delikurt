name: Build iOS App (Xcode Project)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-13

    steps:
      - name: Repository Klonla
        uses: actions/checkout@v4

      - name: Python 3.10 Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kivy-iOS Toolchain Yükle
        run: |
          pip install --upgrade pip
          pip install kivy-ios Cython pillow requests

      - name: Xcode Projesi Oluştur (kivy-ios)
        run: |
          toolchain build python3 kivy
          toolchain create "StokTakip" .

      - name: iOS Proje Çıktısını Artifact Olarak Yükle
        uses: actions/upload-artifact@v4
        with:
          name: stok-takip-ios-xcode-project
          path: StokTakip-ios/
