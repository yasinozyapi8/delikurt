name: Build iOS App (Xcode Project)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Repository Klonla
        uses: actions/checkout@v4

      - name: Python 3.11 Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kivy-iOS Önbelleği (Cache) Tanımla
        uses: actions/cache@v4
        with:
          path: ~/.kivy-ios
          key: ${{ runner.os }}-kivy-ios-${{ hashFiles('app_mobile_ios.py') }}
          restore-keys: |
            ${{ runner.os }}-kivy-ios-

      - name: Kivy-iOS Toolchain ve Bağımlılıkları Yükle
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install kivy-ios Cython pillow requests

      - name: iOS Giriş Dosyasını Hazırla
        run: |
          cp app_mobile_ios.py main.py

      - name: Xcode Projesi Oluştur
        run: |
          toolchain build python3 kivy
          toolchain create "StokTakip" .

      - name: iOS Proje Çıktısını Artifact Olarak Yükle
        uses: actions/upload-artifact@v4
        with:
          name: stok-takip-ios-xcode-project
          path: StokTakip-ios/
