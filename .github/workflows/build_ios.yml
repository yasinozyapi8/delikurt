name: Build iOS App for Appetize (Simulator)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios-simulator:
    runs-on: macos-14

    steps:
      - name: Repository Klonla
        uses: actions/checkout@v4

      - name: Python 3.11 Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kivy-iOS Toolchain ve Bağımlılıkları Yükle
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install kivy-ios Cython pillow requests

      - name: iOS Giriş Dosyasını Hazırla
        run: |
          cp app_mobile_ios.py main.py

      - name: Xcode Projesi Oluştur
        run: |
          toolchain build python3 kivy
          toolchain create "StokTakip" .

      - name: iOS Simülatör .app Paketini Derle (xcodebuild)
        run: |
          cd StokTakip-ios
          xcodebuild -project StokTakip.xcodeproj -scheme StokTakip -sdk iphonesimulator -configuration Debug BUILD_DIR=build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Appetize Uyumlu .app Zip Dosyası Oluştur
        run: |
          cd StokTakip-ios/build/Debug-iphonesimulator
          zip -r ../../../stok_takip_appetize.zip StokTakip.app

      - name: Appetize Zip Dosyasını Artifact Olarak Yükle
        uses: actions/upload-artifact@v4
        with:
          name: stok-takip-appetize-build
          path: stok_takip_appetize.zip
